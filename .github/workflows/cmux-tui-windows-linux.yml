name: cmux-tui (Windows + Linux)

# Keeps the community Windows/Linux port of cmux-tui building and passing.
# Fork of manaflow-ai/cmux (Manaflow, Inc.); see cmux-tui/docs/ATTRIBUTION-PORT.md.

on:
  push:
    branches: [main, windows-linux-port]
    paths: ['cmux-tui/**', 'ghostty', '.github/workflows/cmux-tui-windows-linux.yml']
  pull_request:
    paths: ['cmux-tui/**', 'ghostty', '.github/workflows/cmux-tui-windows-linux.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmux-tui-windows-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 ships the MSVC 14.4x toolset. The newest runner images carry an
        # MSVC STL that rejects Zig 0.16's bundled clang (STL1000, needs Clang 22+).
        os: [ubuntu-latest, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init ghostty submodule only
        run: git submodule update --init --depth 1 ghostty

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libclang-dev pkg-config

      - name: Locate libclang (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sSLo zig.zip "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-windows-${ZIG_VERSION}.zip"
            echo "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e  zig.zip" | sha256sum -c -
            unzip -q zig.zip -d "$RUNNER_TEMP"
            echo "$(cygpath -w "$RUNNER_TEMP/zig-x86_64-windows-${ZIG_VERSION}")" >> "$GITHUB_PATH"
          else
            curl -sSLo zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
            mkdir -p "$RUNNER_TEMP/zig" && tar -xf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
            echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          fi

      - name: Install pinned Rust (rust-toolchain.toml)
        working-directory: cmux-tui
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cmux-tui

      - name: Build
        working-directory: cmux-tui
        run: cargo build -p cmux-tui

      - name: Test
        working-directory: cmux-tui
        timeout-minutes: 25
        # durable_workspace_creation_supports_the_in_process_terminal_runtime is
        # flaky under parallel runs (passes alone); tracked in docs/building-windows-linux.md.
        run: >
          cargo test -p cmux-pty -p cmux-tui-core --no-fail-fast --
          --test-threads=1
          --skip durable_workspace_creation_supports_the_in_process_terminal_runtime
          --skip stalled_surface_route_does_not_block_shared_cdp_reader

      - name: Smoke test (server, terminal round trip)
        working-directory: cmux-tui
        run: |
          set -eu
          BIN=target/debug/cmux-tui
          [ "$RUNNER_OS" = "Windows" ] && BIN=target/debug/cmux-tui.exe
          timeout 90 "$BIN" server start --session ci > server.log 2>&1 &
          for i in $(seq 1 20); do
            "$BIN" --session ci --json server status 2>/dev/null | grep -q '"running"' && break
            sleep 1
          done
          "$BIN" --session ci --json server status
          OUT=$("$BIN" --session ci --json tab create terminal)
          TERM_ID=$(echo "$OUT" | grep -o '"terminal_id":"[^"]*"' | cut -d'"' -f4)
          test -n "$TERM_ID"
          "$BIN" --session ci terminal "$TERM_ID" write --text "echo cmux-ci-$((6*7))"$'\r'
          "$BIN" --session ci terminal "$TERM_ID" screen wait --pattern 'cmux-ci-42' --timeout-ms 15000
          "$BIN" --session ci server stop
