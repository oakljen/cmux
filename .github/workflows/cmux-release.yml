name: cmux release (Windows + Linux)

# Builds installable packages of the community Windows/Linux port and attaches them
# to a DRAFT GitHub Release (publish it manually after checking the files).
#
#   git tag v0.1.0 && git push origin v0.1.0     -> build + draft release
#   Actions > "cmux release" > Run workflow       -> build, artifacts only
#
# Fork of cmux by Manaflow, Inc. (https://github.com/manaflow-ai/cmux). The server,
# protocol and web frontend are upstream's work; terminal engine: Ghostty.
# See cmux-tui/docs/ATTRIBUTION-PORT.md.

on:
  push:
    tags: ['v*']
    # Smoke-build (no release) whenever this workflow itself changes.
    branches: [windows-linux-port, main]
    paths: ['.github/workflows/cmux-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmux-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.16.0
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022: the newest MSVC STL rejects Zig 0.16's bundled clang (STL1000).
          - { name: windows-x64, os: windows-2022, bundles: nsis }
          # ubuntu-22.04: older glibc, so the packages run on more distributions.
          - { name: linux-x64, os: ubuntu-22.04, bundles: 'deb,appimage' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init ghostty submodule only
        run: git submodule update --init --depth 1 ghostty

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libclang-dev pkg-config unzip patchelf \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Locate libclang (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sSLo zig.zip "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-windows-${ZIG_VERSION}.zip"
            echo "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e  zig.zip" | sha256sum -c -
            unzip -q zig.zip -d "$RUNNER_TEMP"
            echo "$(cygpath -w "$RUNNER_TEMP/zig-x86_64-windows-${ZIG_VERSION}")" >> "$GITHUB_PATH"
          else
            curl -sSLo zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
            mkdir -p "$RUNNER_TEMP/zig" && tar -xf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
            echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          fi

      - name: Install pinned Rust (rust-toolchain.toml)
        working-directory: cmux-tui
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cmux-tui
            cmux-tui/frontends/desktop/src-tauri

      - name: Build TypeScript SDK and web frontend
        working-directory: cmux-tui
        run: |
          (cd bindings/typescript && npm ci --no-audit --no-fund && npm run build)
          (cd frontends/web && npm ci --no-audit --no-fund && npm run build)

      - name: Build cmux-tui (release)
        working-directory: cmux-tui
        run: cargo build -p cmux-tui --release

      - name: Stage sidecar and build the desktop installers
        working-directory: cmux-tui/frontends/desktop
        run: |
          npm ci --no-audit --no-fund
          node scripts/prepare-sidecar.mjs
          npx tauri build --bundles "${{ matrix.bundles }}"

      - name: Collect packages
        run: |
          set -eu
          OUT="$RUNNER_TEMP/dist"; mkdir -p "$OUT"
          BUNDLE=cmux-tui/frontends/desktop/src-tauri/target/release/bundle
          TUI=cmux-tui/target/release
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$BUNDLE"/nsis/*-setup.exe "$OUT/"
            ( cd "$TUI" && 7z a -tzip "$OUT/cmux-tui-windows-x64.zip" cmux-tui.exe >/dev/null )
          else
            cp "$BUNDLE"/deb/*.deb "$OUT/"
            cp "$BUNDLE"/appimage/*.AppImage "$OUT/"
            tar -C "$TUI" -czf "$OUT/cmux-tui-linux-x64.tar.gz" cmux-tui
          fi
          ls -la "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: cmux-${{ matrix.name }}
          path: ${{ env.OUT }}/*
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
          body: |
            ## Install

            - **Windows:** run `cmux_*_x64-setup.exe`. The installer is **not code-signed**, so
              Windows SmartScreen will warn ("More info" > "Run anyway"). Needs the Microsoft
              Edge WebView2 runtime (included in Windows 11).
            - **Linux (Debian/Ubuntu):** `sudo apt install ./cmux_*_amd64.deb`
            - **Linux (any distro):** `chmod +x cmux_*.AppImage && ./cmux_*.AppImage`
            - **Terminal-only:** `cmux-tui-windows-x64.zip` / `cmux-tui-linux-x64.tar.gz`
            - Verify downloads against `SHA256SUMS`.

            ## Credit

            This is a community Windows/Linux port of **cmux** by **Manaflow, Inc.**
            (https://github.com/manaflow-ai/cmux). The server, protocol and web frontend are
            upstream's work; terminal engine: **Ghostty** (Mitchell Hashimoto and contributors).
            GPL-3.0-or-later. Not affiliated with or endorsed by Manaflow.

            ## Known limitations

            Sessions do not persist across app restarts on Windows (durable terminal hosts are
            Unix-only). See `cmux-tui/docs/building-windows-linux.md`.
